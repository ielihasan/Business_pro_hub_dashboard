# ─── PRODUCTION PROFILE (Azure App Service) ───────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=prod  (set in Azure App Service env vars)

# Server — Azure App Service sets SERVER_PORT=80 internally; respect it
server.port=${SERVER_PORT:${PORT:8181}}

# App URL (used in email links)
app.url=${APP_URL:https://businessprohub.me}

# CORS — set CORS_ALLOWED_ORIGINS in Azure env vars to include Vercel domain
# e.g. https://businessprohub.me,https://www.businessprohub.me,https://your-app.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://businessprohub.me,https://www.businessprohub.me}

# Logging — reduce verbosity in production
logging.level.com.businessprohub=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN

# HikariCP — tighter pool for cloud (Azure B1 has limited resources)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000
