# Server
server.port=8080

# Jackson — use snake_case for all JSON responses (matches frontend field names)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Database — Supabase PostgreSQL (Transaction pooler)
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true&stringtype=unspecified&prepareThreshold=0
spring.datasource.username=postgres.hjblbmmyfznxomsrxhme
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool (compatible with transaction-mode pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Supabase
supabase.url=https://hjblbmmyfznxomsrxhme.supabase.co
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
# jwt-secret removed — ES256 public key hardcoded in JwtService.java (from JWKS)

# Resend email API
resend.api-key=${RESEND_API_KEY}
resend.from-email=BusinessHub Pro <noreply@businessprohub.me>

# App URLs
app.url=http://localhost:3002
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:21gy5.test@inbox.testmail.app}

# CORS
cors.allowed-origins=http://localhost:3002,http://localhost:3001,http://127.0.0.1:3002,http://127.0.0.1:3001

# Logging
logging.level.com.businessprohub=DEBUG
logging.level.org.hibernate.SQL=WARN
